<VirtualHost *:80>
        ServerAdmin webmaster@localhost

        ServerName keynshamseals.org
        ServerAlias www.keynshamseals.org

        DocumentRoot /var/www/keynshamseals

        <Directory /var/www/keynshamseals/>
            Options FollowSymLinks
            AllowOverride None
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
